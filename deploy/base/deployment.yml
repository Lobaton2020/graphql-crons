apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronogramas-api
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: cronogramas-api
  template:
    metadata:
      labels:
        app: cronogramas-api
    spec:
      containers:
        - name: cronogramas-api
          image: aflobaton/cronogramas-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: env-file
          secret:
            secretName: cronogramas-secrets
